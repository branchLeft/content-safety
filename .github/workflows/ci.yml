name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# `packages: read` because two dev dependencies are hosted on GitHub
# Packages, which answers 401 to an anonymous request even for a public
# package.
permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run coverage

  eval-harness:
    name: Evaluation harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: eval
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned linters
        run: python3 -m pip install ruff==0.17.3 mypy==2.4.1

      - name: Unit tests
        run: python3 -m unittest discover -s tests -t .

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy corpus_eval tests
